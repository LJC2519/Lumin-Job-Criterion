<svg viewBox="0 0 680 496" width="100%" role="img">
  <title>任务到技能路由覆盖图</title>
  <desc>示例任务被解构为三个子任务，经本地索引与市场搜索双路检索，三个技能分别覆盖三个子任务，另有一个无技能覆盖的缺口转人工机制。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="140" y="40" width="400" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">用户任务：申报书数据合规章节</text>
  <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">解构 → 双路检索 → 匹配 → 覆盖</text>
  <path d="M340 96 L340 116" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="120" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="150" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">① 中文去 AI 腔</text>
  <text x="150" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">语言层</text>
  <rect x="250" y="120" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">② 术语口径统一</text>
  <text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">一致性层</text>
  <rect x="440" y="120" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="530" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">③ 导出交付 PDF</text>
  <text x="530" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">交付层</text>
  <path d="M150 176 L150 192" fill="none" stroke="#B4B2A9" stroke-width="1"/>
  <path d="M340 176 L340 192" fill="none" stroke="#B4B2A9" stroke-width="1"/>
  <path d="M530 176 L530 192" fill="none" stroke="#B4B2A9" stroke-width="1"/>
  <path d="M150 192 L530 192" fill="none" stroke="#B4B2A9" stroke-width="1"/>
  <path d="M340 192 L340 206" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="210" width="560" height="64" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="76" y="222" width="256" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="204" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">本地索引 · 秒回</text>
  <text x="204" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">本地索引 · 已装技能秒查</text>
  <rect x="348" y="222" width="256" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="476" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">市场搜索 · SkillHub</text>
  <text x="476" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">find-skills · 语义检索</text>
  <path d="M340 274 L340 294" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="300" width="180" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="150" y="322" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">libai-skill</text>
  <text x="150" y="342" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">中文去 AI 味润色</text>
  <text x="150" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">解决 ①</text>
  <rect x="250" y="300" width="180" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="322" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">light-consistency</text>
  <text x="340" y="342" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">术语口径一致性门</text>
  <text x="340" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">解决 ②</text>
  <rect x="440" y="300" width="180" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="530" y="322" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">docx + pdf</text>
  <text x="530" y="342" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">排版导出交付件</text>
  <text x="530" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">解决 ③</text>
  <path d="M340 372 L340 390" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="396" width="560" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="340" y="414" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">缺口：法规时效核查</text>
  <text x="340" y="434" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">无技能覆盖 → 转独立复核机制（人审），不用通用能力硬顶</text>
  <text x="340" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">零命中不硬凑——覆盖图敢画缺口，是这套流程的纪律</text>
</svg>
